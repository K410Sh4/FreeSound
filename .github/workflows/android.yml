name: Android APK + versões

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Android SDK
        uses: android-actions/setup-android@v4
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Testes e APK instalável de desenvolvimento
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Arquivar APK de desenvolvimento
        uses: actions/upload-artifact@v4
        with:
          name: FreeSound-v1.0.${{ github.run_number }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
      - name: Preparar assinatura persistente (opcional)
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/freesound-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/freesound-release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Gerar APK assinado para atualizações
        if: steps.signing.outputs.signed == 'true'
        run: gradle --no-daemon :app:assembleRelease
      - name: Publicar APK assinado como artefato
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FreeSound-v1.0.${{ github.run_number }}-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90
      - name: Arquivar versão em GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        shell: bash
        run: |
          tag="v1.0.${{ github.run_number }}"
          if [[ "$SIGNED" == "true" ]]; then
            cp app/build/outputs/apk/release/app-release.apk "FreeSound-$tag.apk"
            gh release create "$tag" "FreeSound-$tag.apk" --title "FreeSound $tag" --notes "APK de versão assinado. Requer conservar o mesmo keystore em versões futuras." --target "$GITHUB_SHA"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "FreeSound-$tag-debug.apk"
            gh release create "$tag" "FreeSound-$tag-debug.apk" --title "FreeSound $tag (teste)" --prerelease --notes "APK de teste, assinado com chave debug temporária. Builds diferentes podem exigir desinstalação para atualizar. Configure segredos de assinatura para versões de produção." --target "$GITHUB_SHA"
          fi
